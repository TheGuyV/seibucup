.stage[hidden] { display: none; }
.stage .ttl { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--hud-yellow); color: #000; font-size: .9rem; }
.stage .ttl b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .ttl b::after { content: " - seibucup.online"; opacity: .75; }
.stage .screen { position: relative; width: 100%; aspect-ratio: 4 / 3; margin: 0 auto; background: #000; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.stage .veil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 20px; color: #fff; background: rgba(0,0,0,.85); font-size: 1rem; }
.stage .veil[hidden] { display: none; }
.stage .veil.err { color: #ffb3b3; }
.stage .veil.busy::before { content: ""; justify-self: center; width: 42px; height: 42px; border: 5px solid rgba(255,255,255,.25); border-top-color: var(--hud-yellow); border-radius: 50%; animation: vspin .8s linear infinite; }
@keyframes vspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .stage .veil.busy::before { animation-duration: 2.4s; } }
.stage .bar { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--hud); border-top: 2px solid var(--hud-yellow); }

.stage .sb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

<body>
<main class="wrap">
  <h1 class="pg"><span class="ko">경기 기록</span><span class="en">Results</span></h1>
  <p class="sub"><span class="ko">공개방 경기만 남아요. 비밀번호 방은 기록하지 않아요.</span><span class="en">Public rooms only - password rooms are never recorded.</span></p>
  <div class="filters" id="filters">
    <button type="button" data-k="all" aria-pressed="true"><span class="ko">전체</span><span class="en">All</span></button>
    <button type="button" data-k="club" aria-pressed="false"><span class="ko">클럽 매치</span><span class="en">Club match</span></button>
    <button type="button" data-k="1v1" aria-pressed="false">1:1</button>
    <button type="button" data-k="2v2" aria-pressed="false">2:2</button>
  </div>
  <p><label class="sub" for="q"><span class="ko">닉네임 찾기</span><span class="en">Find a nickname</span> </label><input id="q" type="search" style="font:inherit;padding:6px 10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)"></p>
  <div id="list"></div>
  <p style="text-align:center"><button type="button" class="btn" id="moreBtn" hidden><span class="ko">더 보기</span><span class="en">More</span></button></p>
</main>
<script src="c.js"></script>
<script>
var all = null, shown = 30, filt = "all";

function rowR(r, i) {
  var h = matchRow(r);
  if (!r.replay || !/^replays\/[^\/]+\.(scr|seibu)$/i.test(r.replay)) return h;
  return h.replace('<div class="mt">', '<div class="mt has-r">').replace(/<\/div>$/, '<button type="button" class="rpl" data-i="' + i + '">' + L("런처로 보기", "Watch in launcher") + "</button></div>");
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok ? Promise.resolve() : Promise.reject();
}
var toastTimer = 0;
function toast(html) {
  var t = $("toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); t.onclick = function () { t.hidden = true; }; document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 7000);
}
var shownRows = [];
$("list").addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("button.rpl"); if (!b) return;
  var r = shownRows[Number(b.dataset.i)]; if (!r) return;
  var url = new URL(r.replay, DATA || (location.origin + "/")).href;
  copyText(url).then(function () {
    toast("<b>" + L("리플레이 주소를 복사했어요", "Replay link copied") + "</b><br>" + L("런처에서 게임 → 리플레이를 누르면 바로 재생돼요.", "In the launcher, Game → Replays plays it straight away."));
  }, function () { toast(L("주소를 복사하지 못했어요. 다시 눌러 주세요.", "Could not copy the link. Please try again.")); });
});
function draw() {
  $("q").placeholder = L("닉네임", "nickname");
  if (all === null) { $("list").innerHTML = '<p class="empty">' + L("불러오는 중…", "Loading…") + "</p>"; return; }
  if (all === false) { $("list").innerHTML = '<p class="empty">' + L("경기 기록을 지금 못 읽었어요.", "Results unavailable right now.") + "</p>"; return; }
  var q = $("q").value.trim().toLowerCase();
  var rs = all.filter(function (r) { return (filt === "all" || kind(r) === filt) && (!q || (r.nicks || []).some(function (n) { return n && n.toLowerCase().indexOf(q) >= 0; })); });
  shownRows = rs.slice(0, shown);
  $("list").innerHTML = shownRows.map(rowR).join("") || '<p class="empty">' + L("맞는 경기가 없어요.", "No matching matches.") + "</p>";
  $("moreBtn").hidden = rs.length <= shown;
}
Array.prototype.forEach.call(document.querySelectorAll("#filters button"), function (b) {
  b.onclick = function () {
    filt = b.dataset.k; shown = 30;
    Array.prototype.forEach.call(document.querySelectorAll("#filters button"), function (x) { x.setAttribute("aria-pressed", x === b); });
    draw();
  };
});
$("q").oninput = function () { shown = 30; draw(); };
$("moreBtn").onclick = function () { shown += 30; draw(); };
try { var qp = new URLSearchParams(location.search).get("q"); if (qp) $("q").value = qp; } catch (e) {}
langHooks.push(draw); draw();
getJSON("results.json").then(function (rs) { all = rs; draw(); }).catch(function () { all = false; draw(); });
</script>
</body></html>
